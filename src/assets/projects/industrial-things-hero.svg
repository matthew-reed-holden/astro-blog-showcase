<svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#1A1C29"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(271, 100%, 71%)"/>
      <stop offset="100%" stop-color="hsl(346, 84%, 61%)"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(217, 71%, 53%)"/>
      <stop offset="100%" stop-color="hsl(271, 100%, 71%)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Abstract Grid/Circuit Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
  </g>

  <!-- Central Nodes & Connections (IoT Architecture) -->
  <g transform="translate(400, 200)">
    <!-- Connections -->
    <path d="M-150 -80 L-50 -20 L0 0" fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
    <path d="M-150 80 L-50 20 L0 0" fill="none" stroke="url(#blueGrad)" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
    <path d="M150 -80 L50 -20 L0 0" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
    <path d="M150 80 L50 20 L0 0" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
    
    <path d="M0 -100 L0 0 L0 100" fill="none" stroke="hsl(271, 100%, 71%)" stroke-width="2" opacity="0.4"/>

    <!-- Data Particles -->
    <circle cx="-100" cy="-50" r="3" fill="hsl(217, 71%, 53%)" filter="url(#glow)"/>
    <circle cx="-100" cy="50" r="3" fill="hsl(217, 71%, 53%)" filter="url(#glow)"/>
    <circle cx="100" cy="-50" r="3" fill="hsl(271, 100%, 71%)" filter="url(#glow)"/>
    <circle cx="100" cy="50" r="3" fill="hsl(271, 100%, 71%)" filter="url(#glow)"/>

    <!-- Outer Nodes (Devices) -->
    <g transform="translate(-150, -80)">
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#14141E" stroke="hsl(217, 71%, 53%)" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="hsl(217, 71%, 53%)"/>
    </g>
    <g transform="translate(-150, 80)">
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#14141E" stroke="hsl(217, 71%, 53%)" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="hsl(217, 71%, 53%)"/>
    </g>

    <!-- Services / Consumers -->
    <g transform="translate(150, -80)">
      <polygon points="0,-25 22,12 -22,12" fill="#14141E" stroke="hsl(271, 100%, 71%)" stroke-width="2"/>
    </g>
    <g transform="translate(150, 80)">
      <polygon points="0,-25 22,12 -22,12" fill="#14141E" stroke="hsl(271, 100%, 71%)" stroke-width="2"/>
    </g>
    
    <g transform="translate(0, -100)">
      <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#14141E" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    </g>
    <g transform="translate(0, 100)">
      <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#14141E" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <line x1="-15" y1="-5" x2="15" y2="-5" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      <line x1="-15" y1="5" x2="15" y2="5" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    </g>

    <!-- Central Hub (Kafka / Platform) -->
    <circle cx="0" cy="0" r="45" fill="#14141E" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-dasharray="10,6"/>
    <circle cx="0" cy="0" r="8" fill="#FFF" filter="url(#glow)"/>
  </g>

</svg>
